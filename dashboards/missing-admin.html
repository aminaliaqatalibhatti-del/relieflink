<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin: Missing Persons | ReliefLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>/* ── TOKENS ── */
:root{--bg:#F5EEDB;--card:#FFFCF4;--g:#1B3A2A;--g2:#2F5A42;--g3:#0f2619;--gold:#C9A227;--gold2:#E8C86A;--ink:#1B3A2A;--mute:#8a866f;--line:#EADFC2;--sh:0 4px 24px rgba(27,58,42,.08);--p:#7C6CF0;--b:#4C8DF6;--gr:#3CC08E;--y:#F5B83D;--o:#F58A3D;--r:#EF5B5B;--rad:16px;--sidebar:250px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);scroll-behavior:smooth;}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;color:var(--ink);background:var(--bg);min-height:100vh;}
a{text-decoration:none;color:inherit;}button{font-family:inherit;cursor:pointer;}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;pointer-events:none;}
.field-input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:14px;resize:vertical;outline:none;transition:.2s;background:var(--bg);color:var(--ink);}
.field-input:focus{border-color:var(--gold);}
.hide{display:none!important;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.fade-up{animation:fadeUp .5s ease both;}
</style>
<style>
/* ── Page-specific ── */
.page-wrap { max-width:820px; margin:0 auto; padding:28px 16px 80px; }
.page-header { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
.page-header .back-btn {
  width:38px; height:38px; border-radius:50%; background:var(--card); border:1px solid var(--line);
  display:grid; place-items:center; flex:none; cursor:pointer; color:var(--g);
}
.page-header .back-btn:hover { background:var(--gold); color:var(--g); }
.page-title { font-size:22px; font-weight:800; color:var(--g); }
.page-sub { font-size:13px; color:var(--mute); margin-bottom:22px; }

/* stats row */
.stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:22px; }
.stat-box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; text-align:center; }
.stat-box b { display:block; font-size:1.6rem; font-weight:800; color:var(--g); }
.stat-box span { font-size:11.5px; color:var(--mute); }

/* filter tabs */
.filter-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.ftab {
  font:600 12.5px 'Plus Jakarta Sans',sans-serif; padding:6px 14px; border-radius:99px;
  border:1.5px solid var(--line); background:var(--card); color:var(--mute); cursor:pointer;
  transition:all .15s; display:inline-flex; align-items:center; gap:6px;
}
.ftab svg.i { width:14px; height:14px; }
.ftab:hover, .ftab.active { background:var(--g); color:#F5EEDB; border-color:var(--g); }
.filter-tabs.prio { margin-bottom:18px; }

/* request card */
.req-card { background:var(--card); border:1px solid var(--line); border-radius:var(--rad); padding:18px; margin-bottom:12px; }
.req-card.critical { border-color:#FCA5A5; background:#FFF7F5; }
.req-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
.req-id   { font-size:13.5px; font-weight:800; color:var(--g); display:flex; align-items:center; gap:7px; }
.req-id svg.i { width:17px; height:17px; color:var(--g2); }
.req-person { font-size:16px; font-weight:800; color:var(--g); margin-bottom:4px; }
.req-meta { font-size:12.5px; color:var(--mute); margin-bottom:4px; }
.req-chips { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
.item-chip {
  font-size:12px; font-weight:600; padding:3px 10px; border-radius:99px;
  background:var(--bg); border:1px solid var(--line); color:var(--g);
}
.item-chip.warn { background:#FEE2E2; border-color:#FCA5A5; color:#991B1B; }

/* status badge */
.badge-status {
  font-size:11.5px; font-weight:700; padding:3px 11px; border-radius:99px;
  background:var(--line); color:var(--g);
}
.badge-status.sent       { background:#EEF2FF; color:#4338CA; }
.badge-status.approved   { background:#FEF3C7; color:#92400E; }
.badge-status.on_the_way { background:#FFEDD5; color:#9A3412; }
.badge-status.delivered  { background:#D1FAE5; color:#065F46; }

/* tracker */
.tracker { display:grid; grid-template-columns:repeat(4,1fr); margin:14px 0 10px; }
.t-step { text-align:center; position:relative; font-size:10.5px; color:var(--mute); }
.t-step .tdot {
  width:24px; height:24px; border-radius:50%; background:var(--line); color:#fff;
  display:grid; place-items:center; margin:0 auto 5px; font-size:11px;
  position:relative; z-index:1; font-weight:700;
}
.t-step::before { content:""; position:absolute; top:11px; left:-50%; width:100%; height:3px; background:var(--line); }
.t-step:first-child::before { display:none; }
.t-step.done .tdot { background:var(--g); }
.t-step.done::before,.t-step.current::before { background:var(--g); }
.t-step.current .tdot { background:var(--gold); box-shadow:0 0 0 4px #FFF0B3; }
.t-step.done,.t-step.current { color:var(--g); font-weight:700; }
.t-step.final.done .tdot { background:var(--gr); }

/* action area */
.action-area { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
.action-area select {
  font:inherit; font-size:13px; color:var(--ink); background:var(--bg);
  padding:8px 12px; border:1px solid var(--line); border-radius:10px; flex:1; min-width:200px;
}
.action-area select:focus { outline:none; border-color:var(--gold); }
.act-btn {
  font:700 13px 'Plus Jakarta Sans',sans-serif; padding:9px 18px; border:none;
  border-radius:10px; cursor:pointer; transition:background .15s;
}
.act-btn.approve  { background:var(--g);  color:#F5EEDB; }
.act-btn.approve:hover  { background:var(--g2); }
.act-btn.assign   { background:var(--gold); color:var(--g); }
.act-btn.assign:hover   { background:#B8910F; }
.act-btn.deliver  { background:var(--gr); color:#fff; }
.act-btn.deliver:hover  { background:#2aab78; }

.call-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.call-btn {
  font:700 12.5px 'Plus Jakarta Sans',sans-serif; padding:8px 14px; border-radius:10px;
  border:1.5px solid var(--line); background:var(--card); color:var(--g); cursor:pointer;
  display:inline-flex; align-items:center; gap:7px;
}
.call-btn svg.i { width:14px; height:14px; }
.call-btn:hover { border-color:var(--gold); background:#FFF8E1; }

/* note */
.req-note { font-size:12.5px; color:var(--mute); background:var(--bg); border-radius:8px; padding:7px 10px; margin-top:6px;
            display:flex; align-items:flex-start; gap:7px; }
.req-note svg.i { width:14px; height:14px; color:var(--g2); flex:none; margin-top:1px; }

/* assigned team shown in the action area */
.who { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--mute); }
.who svg.i { width:15px; height:15px; color:var(--g2); }
.who strong { color:var(--g); }

/* empty */
.empty-state { text-align:center; color:var(--mute); padding:30px 16px; border:1px dashed var(--line); border-radius:var(--rad); font-size:13.5px; }

/* toast */
.rl-toast {
  position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%);
  background:var(--g); color:#F5EEDB; padding:10px 20px; border-radius:10px;
  font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .22s;
  white-space:nowrap; z-index:999;
}
.rl-toast.show { opacity:1; }

@media(max-width:560px){
  .stats-row { grid-template-columns:repeat(2,1fr); }
  .tracker { font-size:9.5px; }
}
</style>
</head>
<body>

<div class="page-wrap">

  <!-- Header -->
  <div class="page-header">
    <button class="back-btn" onclick="history.back()" title="Go back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h1 class="page-title">Missing Persons — Admin</h1>
  </div>
  <p class="page-sub">Review reports, assign search teams and record reunions.</p>

  <!-- Stats -->
  <div class="stats-row" id="statsRow"></div>

  <!-- Status filter -->
  <div class="filter-tabs">
    <button class="ftab active" data-filter="all"        onclick="setFilter('all',this)">All</button>
    <button class="ftab"        data-filter="sent"       onclick="setFilter('sent',this)">New reports</button>
    <button class="ftab"        data-filter="approved"   onclick="setFilter('approved',this)">Under review</button>
    <button class="ftab"        data-filter="on_the_way" onclick="setFilter('on_the_way',this)">Search active</button>
    <button class="ftab"        data-filter="delivered"  onclick="setFilter('delivered',this)">Found</button>
  </div>

  <!-- Priority filter -->
  <div class="filter-tabs prio">
    <button class="ftab active" data-prio="all"     onclick="setPrio('all',this)">All priorities</button>
    <button class="ftab"        data-prio="critical" onclick="setPrio('critical',this)"><i data-i="alert"></i> High priority</button>
    <button class="ftab"        data-prio="normal"  onclick="setPrio('normal',this)">Standard</button>
  </div>

  <!-- List -->
  <div id="adminList"></div>

</div>

<div class="rl-toast" id="toast"></div>

<script src="../config.js"></script>
<script src="livesync.js"></script>
<script>
const KEY    = 'relieflink_missing_requests';
const STEPS  = ['sent','approved','on_the_way','delivered'];
const LABELS = { sent:'Report Filed', approved:'Under Review', on_the_way:'Search Team Active', delivered:'Found / Reunited' };
const TEAMS = [
  {id:'s1',name:'Search Circle 1 — Rawalpindi', phone:'0300-8888801'},
  {id:'s2',name:'Rescue Volunteers — Islamabad',phone:'0301-8888802'},
  {id:'s3',name:'Police Missing Cell Liaison',  phone:'0302-8888803'}
];

/* Simple line icons — same style as the dashboard icon set */
const IP = {
  child:   'M12 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M12 11v6 M9 13.5h6 M10 22l1-5 M14 22l-1-5',
  elderly: 'M12 7a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M10 22v-6a2 2 0 0 0-2-2H7 M12 10l-2 4 M18 9v13',
  user:    'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2 M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',
  medical: 'M9 3h6v6h6v6h-6v6H9v-6H3V9h6z',
  search:  'M21 21l-4.3-4.3 M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z',
  alert:   'M12 3 2 20h20z M12 10v4 M12 17h.01',
  phone:   'M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .8 2.9a2 2 0 0 1-.5 2.1L8.1 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.4 1.9.7 2.9.8a2 2 0 0 1 1.6 1.9z',
  copy:    'M9 9h11v11H9z M5 15V4h11',
  shirt:   'M8 3l4 2 4-2 4 4-3 3-1-1v11H8V9L7 10 4 7z',
  heart:   'M12 21s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.4-7 10-7 10z',
  tag:     'M20.6 13.4 12 22 2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z M7.5 7.5h.01',
  note:    'M12 20h9 M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',
  check:   'M20 6 9 17l-5-5'
};
function ico(n){ return IP[n] ? '<svg class="i" viewBox="0 0 24 24"><path d="'+IP[n]+'"/></svg>' : ''; }
function hydrateIcons(){
  document.querySelectorAll('i[data-i]').forEach(function(e){
    const s = ico(e.dataset.i); if (s) e.outerHTML = s;
  });
}

let activeFilter = 'all';
let activePrio   = 'all';

function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ return []; } }
function save(list){ try{ localStorage.setItem(KEY,JSON.stringify(list)); }catch(e){} }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(iso){ return new Date(iso).toLocaleString([],{dateStyle:'medium',timeStyle:'short'}); }
function fmtDay(d){ return d ? new Date(d+'T00:00:00').toLocaleDateString([],{dateStyle:'medium'}) : '—'; }
function team(id){ return TEAMS.find(t=>t.id===id); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

function update(id, patch){
  const list = load().map(r=> r.id===id ? {...r,...patch,updatedAt:new Date().toISOString()} : r);
  save(list);
  RLive.after(list);
  render();
}

function setFilter(f, btn){
  activeFilter = f;
  document.querySelectorAll('.filter-tabs:not(.prio) .ftab').forEach(b=>b.classList.toggle('active',b===btn));
  render();
}
function setPrio(p, btn){
  activePrio = p;
  document.querySelectorAll('.filter-tabs.prio .ftab').forEach(b=>b.classList.toggle('active',b===btn));
  render();
}

function tracker(status){
  const idx = STEPS.indexOf(status);
  return '<div class="tracker">'+STEPS.map((s,i)=>{
    let c='t-step';
    if(status==='delivered'||i<idx) c+=' done';
    else if(i===idx) c+=' current';
    if(i===STEPS.length-1) c+=' final';
    return `<div class="${c}"><div class="tdot">${c.includes('done')?'✓':i+1}</div>${LABELS[s]}</div>`;
  }).join('')+'</div>';
}

document.getElementById('adminList').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-call],button[data-copy],button[data-approve],button[data-assign],button[data-deliver]');
  if(!btn) return;
  const t = btn.dataset;
  if(t.call){ location.href = 'tel:'+t.call.replace(/[^0-9+]/g,''); }
  else if(t.copy){
    const r = load().find(x=>x.id===t.copy); if(!r) return;
    const txt = 'MISSING PERSON — '+r.pname+' ('+r.age+' yrs, '+r.gender+')\nLast seen: '+fmtDay(r.seenDate)+' '+(r.seenTime||'')+' at '+r.seenPlace+'\nReport Ref: '+r.id+'\nContact: '+r.rphone;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(()=>toast('Alert text copied'),()=>toast('Copy not allowed by browser'));
    } else { toast('Copy not allowed by browser'); }
  }
  else if(t.approve){ update(t.approve,{status:'approved'}); toast('Report acknowledged ✓'); }
  else if(t.assign){
    const sel = document.querySelector(`[data-team-for="${t.assign}"]`);
    if(!sel||!sel.value){ toast('Please select a search team first'); return; }
    update(t.assign,{teamId:sel.value,status:'on_the_way'}); toast('Search team assigned');
  }
  else if(t.deliver){ update(t.deliver,{status:'delivered'}); toast('Marked found / reunited ✓'); }
});

window.addEventListener('storage', e=>{ if(e.key===KEY) render(); });

function render(){
  const all = load();

  const cnt = s => all.filter(r=>r.status===s).length;
  document.getElementById('statsRow').innerHTML = STEPS.map(s=>
    `<div class="stat-box"><b>${cnt(s)}</b><span>${LABELS[s]}</span></div>`
  ).join('');

  let list = activeFilter==='all' ? all : all.filter(r=>r.status===activeFilter);
  if(activePrio!=='all') list = list.filter(r=>(r.priority||'normal')===activePrio);
  const el = document.getElementById('adminList');

  if(!list.length){
    el.innerHTML = '<div class="empty-state">No missing person reports in this view.</div>';
    return;
  }

  el.innerHTML = list.map(r=>{
    const tm = r.teamId && team(r.teamId);
    const crit = r.priority==='critical';
    const chips = [r.catLabel, r.gender+' · '+r.age+' yrs', r.height, crit?'High priority':'']
      .filter(Boolean)
      .map(x=>`<span class="item-chip${x==='High priority'?' warn':''}">${esc(x)}</span>`).join('');
    const when = [fmtDay(r.seenDate), r.seenTime].filter(Boolean).join(' at ');
    let action = '';

    if(r.status==='sent'){
      action = `<div class="action-area">
        <button class="act-btn approve" data-approve="${r.id}">✓ Acknowledge report</button>
      </div>`;
    } else if(r.status==='approved'){
      action = `<div class="action-area">
        <select data-team-for="${r.id}">
          <option value="">— Select search team —</option>
          ${TEAMS.map(v=>`<option value="${v.id}">${esc(v.name)} (${esc(v.phone)})</option>`).join('')}
        </select>
        <button class="act-btn assign" data-assign="${r.id}">Assign Team</button>
      </div>`;
    } else if(r.status==='on_the_way'){
      action = `<div class="action-area">
        <span class="who">${ico('search')} <strong>${esc(tm?.name||'—')}</strong> (${esc(tm?.phone||'')})</span>
        <button class="act-btn deliver" data-deliver="${r.id}">✓ Mark found / reunited</button>
      </div>`;
    } else {
      action = `<div class="action-area"><span style="font-size:12.5px;color:var(--mute)">Reunited — closed by ${esc(tm?.name||'response team')}</span></div>`;
    }

    return `<div class="req-card${crit?' critical':''}">
      <div class="req-head">
        <span class="req-id">${ico(r.icon||'search')} ${esc(r.catLabel||'Missing person')} · ${esc(r.id)}</span>
        <span class="badge-status ${r.status}">${LABELS[r.status]}</span>
      </div>
      <div class="req-person">${esc(r.pname)} <span style="font-size:12.5px;font-weight:600;color:var(--mute)">(${esc(r.relation||'—')})</span></div>
      <div class="req-meta">Last seen ${esc(when)} — ${esc(r.seenPlace)}</div>
      <div class="req-meta">Reported by ${esc(r.rname)} · ${esc(r.rphone)} · FIR: ${esc(r.fir||'—')} · ${fmt(r.createdAt)}</div>
      <div class="req-chips">${chips}</div>
      ${r.clothing?`<div class="req-note">${ico('shirt')}<span>Wearing: ${esc(r.clothing)}</span></div>`:''}
      ${r.medical?`<div class="req-note">${ico('heart')}<span>Medical: ${esc(r.medical)}</span></div>`:''}
      ${r.marks?`<div class="req-note">${ico('tag')}<span>Marks: ${esc(r.marks)}</span></div>`:''}
      ${r.note?`<div class="req-note">${ico('note')}<span>${esc(r.note)}</span></div>`:''}
      <div class="call-row">
        <button type="button" class="call-btn" data-call="${esc(r.rphone)}">${ico('phone')} Call reporter ${esc(r.rphone)}</button>
        <button type="button" class="call-btn" data-copy="${esc(r.id)}">${ico('copy')} Copy alert text</button>
      </div>
      ${tracker(r.status)}
      ${action}
    </div>`;
  }).join('');
}

hydrateIcons();
render();
/* live queue: missing-person reports from every citizen device */
RLive.bind({
  category:'missing', listKey:KEY, admin:true,
  summary: r => 'Missing '+(r.pname||'person')+', '+(r.age||'?')+' yrs '+(r.gender||'')+' · last seen '+(r.seenDate||'')+' '+(r.seenTime||'')+' at '+(r.seenPlace||'')+' · reporter '+(r.rname||'')+' '+(r.rphone||''),
  onChanged: function(){ hydrateIcons(); render(); }
});
RLive.sync().then(function(){ render(); });
RLive.watch();
</script>
</body>
</html>
