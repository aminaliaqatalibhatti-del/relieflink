<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin: Food & Water | ReliefLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
/* ── Page-specific ── */
.page-wrap { max-width: 820px; margin: 0 auto; padding: 28px 16px 80px; }
.page-header { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
.page-header .back-btn {
  width:38px; height:38px; border-radius:50%; background:var(--card); border:1px solid var(--line);
  display:grid; place-items:center; flex:none; cursor:pointer; color:var(--g);
}
.page-header .back-btn:hover { background:var(--gold); color:var(--g); }
.page-title { font-size:22px; font-weight:800; color:var(--g); }
.page-sub { font-size:13px; color:var(--mute); margin-bottom:22px; }

/* stats row */
.stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:22px; }
.stat-box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; text-align:center; }
.stat-box b { display:block; font-size:1.6rem; font-weight:800; color:var(--g); }
.stat-box span { font-size:11.5px; color:var(--mute); }

/* filter tabs */
.filter-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px; }
.ftab {
  font:600 12.5px 'Plus Jakarta Sans',sans-serif; padding:6px 14px; border-radius:99px;
  border:1.5px solid var(--line); background:var(--card); color:var(--mute); cursor:pointer;
  transition:all .15s;
}
.ftab:hover, .ftab.active { background:var(--g); color:#F5EEDB; border-color:var(--g); }

/* request card */
.req-card { background:var(--card); border:1px solid var(--line); border-radius:var(--rad); padding:18px; margin-bottom:12px; }
.req-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
.req-id   { font-size:13.5px; font-weight:800; color:var(--g); }
.req-meta { font-size:12.5px; color:var(--mute); margin-bottom:4px; }
.req-addr { font-size:13px; color:var(--ink); font-weight:600; margin-bottom:8px; }

/* status badge */
.badge-status {
  font-size:11.5px; font-weight:700; padding:3px 11px; border-radius:99px;
  background:var(--line); color:var(--g);
}
.badge-status.sent     { background:#EEF2FF; color:#4338CA; }
.badge-status.approved { background:#ECFDF5; color:#065F46; }
.badge-status.on_the_way { background:#FEF3C7; color:#92400E; }
.badge-status.delivered  { background:#D1FAE5; color:#065F46; }

/* tracker */
.tracker { display:grid; grid-template-columns:repeat(4,1fr); margin:14px 0 10px; }
.t-step { text-align:center; position:relative; font-size:11px; color:var(--mute); }
.t-step .tdot {
  width:24px; height:24px; border-radius:50%; background:var(--line); color:#fff;
  display:grid; place-items:center; margin:0 auto 5px; font-size:11px;
  position:relative; z-index:1; font-weight:700;
}
.t-step::before { content:""; position:absolute; top:11px; left:-50%; width:100%; height:3px; background:var(--line); }
.t-step:first-child::before { display:none; }
.t-step.done .tdot { background:var(--g); }
.t-step.done::before,.t-step.current::before { background:var(--g); }
.t-step.current .tdot { background:var(--gold); box-shadow:0 0 0 4px #FFF0B3; }
.t-step.done,.t-step.current { color:var(--g); font-weight:700; }
.t-step.final.done .tdot { background:var(--gr); }

/* action area */
.action-area { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
.action-area select {
  font:inherit; font-size:13px; color:var(--ink); background:var(--bg);
  padding:8px 12px; border:1px solid var(--line); border-radius:10px; flex:1; min-width:200px;
}
.action-area select:focus { outline:none; border-color:var(--gold); }
.act-btn {
  font:700 13px 'Plus Jakarta Sans',sans-serif; padding:9px 18px; border:none;
  border-radius:10px; cursor:pointer; transition:background .15s;
}
.act-btn.approve  { background:var(--g);  color:#F5EEDB; }
.act-btn.approve:hover  { background:var(--g2); }
.act-btn.assign   { background:var(--gold); color:var(--g); }
.act-btn.assign:hover   { background:#B8910F; }
.act-btn.deliver  { background:var(--gr); color:#fff; }
.act-btn.deliver:hover  { background:#2aab78; }
.act-btn.ghost    { background:transparent; border:1.5px solid var(--line); color:var(--mute); }

/* note */
.req-note { font-size:12.5px; color:var(--mute); background:var(--bg); border-radius:8px; padding:7px 10px; margin-bottom:8px; }

/* empty */
.empty-state { text-align:center; color:var(--mute); padding:30px 16px; border:1px dashed var(--line); border-radius:var(--rad); font-size:13.5px; }

/* toast */
.rl-toast {
  position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%);
  background:var(--g); color:#F5EEDB; padding:10px 20px; border-radius:10px;
  font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .22s;
  white-space:nowrap; z-index:999;
}
.rl-toast.show { opacity:1; }

@media(max-width:560px){
  .stats-row { grid-template-columns:repeat(2,1fr); }
  .tracker { font-size:10px; }
}
</style>
</head>
<body>

<div class="page-wrap">

  <!-- Header -->
  <div class="page-header">
    <button class="back-btn" onclick="history.back()" title="Go back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h1 class="page-title">Food &amp; Water — Admin</h1>
  </div>
  <p class="page-sub">Approve requests and assign volunteer riders.</p>

  <!-- Stats -->
  <div class="stats-row" id="statsRow"></div>

  <!-- Filter tabs -->
  <div class="filter-tabs">
    <button class="ftab active" data-filter="all"      onclick="setFilter('all',this)">All</button>
    <button class="ftab"        data-filter="sent"     onclick="setFilter('sent',this)">New</button>
    <button class="ftab"        data-filter="approved" onclick="setFilter('approved',this)">Approved</button>
    <button class="ftab"        data-filter="on_the_way" onclick="setFilter('on_the_way',this)">On The Way</button>
    <button class="ftab"        data-filter="delivered"  onclick="setFilter('delivered',this)">Delivered</button>
  </div>

  <!-- List -->
  <div id="adminList"></div>

</div>

<div class="rl-toast" id="toast"></div>

<script>
const KEY    = 'relieflink_food_requests';
const STEPS  = ['sent','approved','on_the_way','delivered'];
const LABELS = { sent:'Request Sent', approved:'Approved', on_the_way:'On The Way', delivered:'Delivered' };
const RIDERS = [
  {id:'r1',name:'Ali Raza',phone:'0300-1111111'},
  {id:'r2',name:'Hamza Khan',phone:'0301-2222222'},
  {id:'r3',name:'Sana Malik',phone:'0302-3333333'}
];

let activeFilter = 'all';

function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ return []; } }
function save(list){ try{ localStorage.setItem(KEY,JSON.stringify(list)); }catch(e){} }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(iso){ return new Date(iso).toLocaleString([],{dateStyle:'medium',timeStyle:'short'}); }
function rider(id){ return RIDERS.find(r=>r.id===id); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

function update(id, patch){
  save(load().map(r=> r.id===id ? {...r,...patch,updatedAt:new Date().toISOString()} : r));
  render();
}

function setFilter(f, btn){
  activeFilter = f;
  document.querySelectorAll('.ftab').forEach(b=>b.classList.toggle('active',b===btn));
  render();
}

function tracker(status){
  const idx = STEPS.indexOf(status);
  return '<div class="tracker">'+STEPS.map((s,i)=>{
    let c='t-step';
    if(status==='delivered'||i<idx) c+=' done';
    else if(i===idx) c+=' current';
    if(i===STEPS.length-1) c+=' final';
    return `<div class="${c}"><div class="tdot">${c.includes('done')?'✓':i+1}</div>${LABELS[s]}</div>`;
  }).join('')+'</div>';
}

document.getElementById('adminList').addEventListener('click', e=>{
  const t = e.target.dataset;
  if(t.approve){ update(t.approve,{status:'approved'}); toast('Request approved ✓'); }
  else if(t.assign){
    const sel = document.querySelector(`[data-rider-for="${t.assign}"]`);
    if(!sel||!sel.value){ toast('Please select a rider first'); return; }
    update(t.assign,{riderId:sel.value,status:'on_the_way'}); toast('Rider assigned 🛵');
  }
  else if(t.deliver){ update(t.deliver,{status:'delivered'}); toast('Marked as delivered ✓'); }
});

window.addEventListener('storage', e=>{ if(e.key===KEY) render(); });

function render(){
  const all = load();

  // stats
  const cnt = s => all.filter(r=>r.status===s).length;
  document.getElementById('statsRow').innerHTML = STEPS.map(s=>
    `<div class="stat-box"><b>${cnt(s)}</b><span>${LABELS[s]}</span></div>`
  ).join('');

  // filter
  const list = activeFilter==='all' ? all : all.filter(r=>r.status===activeFilter);
  const el   = document.getElementById('adminList');

  if(!list.length){
    el.innerHTML = '<div class="empty-state">No requests in this category yet.</div>';
    return;
  }

  el.innerHTML = list.map(r=>{
    const rd   = r.riderId && rider(r.riderId);
    const icon = r.type==='food'?'🍲':'💧';
    let action = '';

    if(r.status==='sent'){
      action = `<div class="action-area">
        <button class="act-btn approve" data-approve="${r.id}">✓ Approve</button>
      </div>`;
    } else if(r.status==='approved'){
      action = `<div class="action-area">
        <select data-rider-for="${r.id}">
          <option value="">— Select volunteer rider —</option>
          ${RIDERS.map(v=>`<option value="${v.id}">${esc(v.name)} (${esc(v.phone)})</option>`).join('')}
        </select>
        <button class="act-btn assign" data-assign="${r.id}">Assign Rider</button>
      </div>`;
    } else if(r.status==='on_the_way'){
      action = `<div class="action-area">
        <span style="font-size:13px;color:var(--mute)">🛵 <strong>${esc(rd?.name||'—')}</strong> (${esc(rd?.phone||'')})</span>
        <button class="act-btn deliver" data-deliver="${r.id}">✓ Mark Delivered</button>
      </div>`;
    } else {
      action = `<div class="action-area"><span style="font-size:12.5px;color:var(--mute)">Delivered by ${esc(rd?.name||'—')}</span></div>`;
    }

    return `<div class="req-card">
      <div class="req-head">
        <span class="req-id">${icon} ${esc(r.type==='food'?'Food':'Water')} · ${esc(r.id)}</span>
        <span class="badge-status ${r.status}">${LABELS[r.status]}</span>
      </div>
      <div class="req-addr">${esc(r.name)} · ${esc(r.phone)}</div>
      <div class="req-meta">${esc(r.address)} · ${esc(r.quantity)} unit(s) for ${esc(r.people)} people · ${fmt(r.createdAt)}</div>
      ${r.note ? `<div class="req-note">📝 ${esc(r.note)}</div>` : ''}
      ${tracker(r.status)}
      ${action}
    </div>`;
  }).join('');
}

render();
</script>
</body>
</html>
