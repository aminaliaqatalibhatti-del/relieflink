<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin: Home Essentials | ReliefLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>/* ── TOKENS ── */
:root{--bg:#F5EEDB;--card:#FFFCF4;--g:#1B3A2A;--g2:#2F5A42;--g3:#0f2619;--gold:#C9A227;--gold2:#E8C86A;--ink:#1B3A2A;--mute:#8a866f;--line:#EADFC2;--sh:0 4px 24px rgba(27,58,42,.08);--p:#7C6CF0;--b:#4C8DF6;--gr:#3CC08E;--y:#F5B83D;--o:#F58A3D;--r:#EF5B5B;--rad:16px;--sidebar:250px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);scroll-behavior:smooth;}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;color:var(--ink);background:var(--bg);min-height:100vh;}
a{text-decoration:none;color:inherit;}button{font-family:inherit;cursor:pointer;}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;pointer-events:none;}
.field-input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:14px;resize:vertical;outline:none;transition:.2s;background:var(--bg);color:var(--ink);}
.field-input:focus{border-color:var(--gold);}
.hide{display:none!important;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.fade-up{animation:fadeUp .5s ease both;}
</style>
<style>
/* ── Page-specific ── */
.page-wrap { max-width:820px; margin:0 auto; padding:28px 16px 80px; }
.page-header { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
.page-header .back-btn {
  width:38px; height:38px; border-radius:50%; background:var(--card); border:1px solid var(--line);
  display:grid; place-items:center; flex:none; cursor:pointer; color:var(--g);
}
.page-header .back-btn:hover { background:var(--gold); color:var(--g); }
.page-title { font-size:22px; font-weight:800; color:var(--g); }
.page-sub { font-size:13px; color:var(--mute); margin-bottom:22px; }

/* stats row */
.stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:22px; }
.stat-box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; text-align:center; }
.stat-box b { display:block; font-size:1.6rem; font-weight:800; color:var(--g); }
.stat-box span { font-size:11.5px; color:var(--mute); }

/* filter tabs */
.filter-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.ftab {
  font:600 12.5px 'Plus Jakarta Sans',sans-serif; padding:6px 14px; border-radius:99px;
  border:1.5px solid var(--line); background:var(--card); color:var(--mute); cursor:pointer;
  transition:all .15s; display:inline-flex; align-items:center; gap:6px;
}
.ftab svg.i { width:14px; height:14px; }
.ftab:hover, .ftab.active { background:var(--g); color:#F5EEDB; border-color:var(--g); }
.filter-tabs.mode { margin-bottom:18px; }

/* request card */
.req-card { background:var(--card); border:1px solid var(--line); border-radius:var(--rad); padding:18px; margin-bottom:12px; }
.req-card.critical { border-color:#FCA5A5; background:#FFF7F5; }
.req-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
.req-id   { font-size:13.5px; font-weight:800; color:var(--g); display:flex; align-items:center; gap:7px; }
.req-id svg.i { width:17px; height:17px; color:var(--g2); }
.req-meta { font-size:12.5px; color:var(--mute); margin-bottom:4px; }
.req-addr { font-size:13px; color:var(--ink); font-weight:600; margin-bottom:8px; }
.req-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.item-chip {
  font-size:12px; font-weight:600; padding:3px 10px; border-radius:99px;
  background:var(--bg); border:1px solid var(--line); color:var(--g);
  display:inline-flex; align-items:center; gap:5px;
}
.item-chip svg.i { width:13px; height:13px; }
.item-chip.u-urgent   { background:#FEF3C7; border-color:#FCD34D; color:#92400E; }
.item-chip.u-critical { background:#FEE2E2; border-color:#FCA5A5; color:#991B1B; }

/* status badge */
.badge-status {
  font-size:11.5px; font-weight:700; padding:3px 11px; border-radius:99px;
  background:var(--line); color:var(--g);
}
.badge-status.sent       { background:#EEF2FF; color:#4338CA; }
.badge-status.approved   { background:#ECFDF5; color:#065F46; }
.badge-status.on_the_way { background:#FEF3C7; color:#92400E; }
.badge-status.delivered  { background:#D1FAE5; color:#065F46; }

/* stay details block */
.stay-box { background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; font-size:12.5px; color:var(--ink); line-height:1.7; }
.stay-box b { color:var(--g); }

/* tracker */
.tracker { display:grid; grid-template-columns:repeat(4,1fr); margin:14px 0 10px; }
.t-step { text-align:center; position:relative; font-size:10.5px; color:var(--mute); }
.t-step .tdot {
  width:24px; height:24px; border-radius:50%; background:var(--line); color:#fff;
  display:grid; place-items:center; margin:0 auto 5px; font-size:11px;
  position:relative; z-index:1; font-weight:700;
}
.t-step::before { content:""; position:absolute; top:11px; left:-50%; width:100%; height:3px; background:var(--line); }
.t-step:first-child::before { display:none; }
.t-step.done .tdot { background:var(--g); }
.t-step.done::before,.t-step.current::before { background:var(--g); }
.t-step.current .tdot { background:var(--gold); box-shadow:0 0 0 4px #FFF0B3; }
.t-step.done,.t-step.current { color:var(--g); font-weight:700; }
.t-step.final.done .tdot { background:var(--gr); }

/* action area */
.action-area { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
.action-area select {
  font:inherit; font-size:13px; color:var(--ink); background:var(--bg);
  padding:8px 12px; border:1px solid var(--line); border-radius:10px; flex:1; min-width:200px;
}
.action-area select:focus { outline:none; border-color:var(--gold); }
.act-btn {
  font:700 13px 'Plus Jakarta Sans',sans-serif; padding:9px 18px; border:none;
  border-radius:10px; cursor:pointer; transition:background .15s;
  display:inline-flex; align-items:center; gap:6px;
}
.act-btn svg.i { width:15px; height:15px; }
.act-btn.approve  { background:var(--g);  color:#F5EEDB; }
.act-btn.approve:hover  { background:var(--g2); }
.act-btn.assign   { background:var(--gold); color:var(--g); }
.act-btn.assign:hover   { background:#B8910F; }
.act-btn.deliver  { background:var(--gr); color:#fff; }
.act-btn.deliver:hover  { background:#2aab78; }
.who { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--mute); }
.who svg.i { width:15px; height:15px; color:var(--g2); }
.who strong { color:var(--g); }

/* note */
.req-note { font-size:12.5px; color:var(--mute); background:var(--bg); border-radius:8px; padding:7px 10px; margin-bottom:8px; }

/* empty */
.empty-state { text-align:center; color:var(--mute); padding:30px 16px; border:1px dashed var(--line); border-radius:var(--rad); font-size:13.5px; }

/* toast */
.rl-toast {
  position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%);
  background:var(--g); color:#F5EEDB; padding:10px 20px; border-radius:10px;
  font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .22s;
  white-space:nowrap; z-index:999;
}
.rl-toast.show { opacity:1; }

@media(max-width:560px){
  .stats-row { grid-template-columns:repeat(2,1fr); }
  .tracker { font-size:9.5px; }
}
</style>
</head>
<body>

<div class="page-wrap">

  <!-- Header -->
  <div class="page-header">
    <button class="back-btn" onclick="history.back()" title="Go back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h1 class="page-title">Home Essentials — Admin</h1>
  </div>
  <p class="page-sub">Two kinds of requests: supplies delivered to a home or shelter, and families looking for a host home after their house was damaged.</p>

  <!-- Stats -->
  <div class="stats-row" id="statsRow"></div>

  <!-- Status filter -->
  <div class="filter-tabs">
    <button class="ftab active" data-filter="all"        onclick="setFilter('all',this)">All</button>
    <button class="ftab"        data-filter="sent"       onclick="setFilter('sent',this)">New</button>
    <button class="ftab"        data-filter="approved"   onclick="setFilter('approved',this)">Approved</button>
    <button class="ftab"        data-filter="on_the_way" onclick="setFilter('on_the_way',this)">Assigned</button>
    <button class="ftab"        data-filter="delivered"  onclick="setFilter('delivered',this)">Completed</button>
  </div>

  <!-- Mode filter -->
  <div class="filter-tabs mode">
    <button class="ftab active" data-mode="all"    onclick="setMode('all',this)">All requests</button>
    <button class="ftab"        data-mode="stay"   onclick="setMode('stay',this)"><i data-i="stay"></i> Find a home</button>
    <button class="ftab"        data-mode="supply" onclick="setMode('supply',this)"><i data-i="bag"></i> Supplies</button>
  </div>

  <!-- List -->
  <div id="adminList"></div>

</div>

<div class="rl-toast" id="toast"></div>

<script src="../config.js"></script>
<script src="livesync.js"></script>
<script>
const KEY    = 'relieflink_home_requests';
const STEPS  = ['sent','approved','on_the_way','delivered'];
const LABELS      = { sent:'Request Sent', approved:'Approved',       on_the_way:'On The Way',     delivered:'Delivered' };
const STAY_LABELS = { sent:'Request Filed', approved:'Family Verified', on_the_way:'Host Home Found', delivered:'Shifted / Housed' };
const STAT_LABELS = { sent:'New', approved:'Approved', on_the_way:'Assigned', delivered:'Completed' };
const URGENCY = { normal:'Normal', urgent:'Urgent', critical:'Critical' };

const RIDERS = [
  {id:'r1',name:'Ali Raza',phone:'0300-1111111'},
  {id:'r2',name:'Hamza Khan',phone:'0301-2222222'},
  {id:'r3',name:'Sana Malik',phone:'0302-3333333'}
];
const HOSTS = [
  {id:'h1',name:'Host home — Ahmed family, 2 rooms, Bahria Town, Rawalpindi', phone:'0300-9999901', capacity:6},
  {id:'h2',name:'Host home — Malik house, 1 floor free, Satellite Town, Multan', phone:'0301-9999902', capacity:4},
  {id:'h3',name:'Host home — Bano bakery upstairs, Ghari Mitu, Rawalpindi',      phone:'0302-9999903', capacity:5},
  {id:'h4',name:'Community host house — Jadoon welfare society, Rajanpur',        phone:'0303-9999904', capacity:10}
];

/* Simple line icons — same style as the dashboard icon set */
const IP = {
  stay:    'M3 11l9-8 9 8 M5 10v10h14V10 M10 20v-4a2 2 0 0 1 4 0v4',
  home:    'M3 11l9-8 9 8 M5 10v10h14V10',
  bag:     'M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z M3 6h18 M16 10a4 4 0 0 1-8 0',
  kitchen: 'M5 11h14v5a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z M12 8V4 M8 8V5 M16 8V5',
  bed:     'M2 19v-7h20v7 M2 12V9a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v3 M2 19h20 M5 19v2 M19 19v2',
  drop:    'M12 2.7s6 6.3 6 11.3a6 6 0 0 1-12 0c0-5 6-11.3 6-11.3z',
  tools:   'M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3-3a6 6 0 0 1-7 7l-1.4 1.4a1 1 0 0 1-1.4 0L7 10.4a1 1 0 0 1 0-1.4L8.4 7.6a6 6 0 0 1 7-7z',
  shield:  'M12 2l7 4v6c0 5.2-4 9.6-7 11-3-1.4-7-5.8-7-11V6z',
  scooter: 'M4 17a3 3 0 1 0 6 0 3 3 0 0 0-6 0z M15 17a3 3 0 1 0 6 0 3 3 0 0 0-6 0z M7 17h8 M10 8h4l2 9 M6 8h5l1 9',
  key:     'M15 8a4 4 0 1 0-3.5 4L14 15h3v3h3v-3l-2.5-2.5A4 4 0 0 0 15 8z',
  users:   'M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2 M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M21 21v-2a4 4 0 0 0-3-3.9 M16 3.1a4 4 0 0 1 0 7.8',
  check:   'M20 6 9 17l-5-5'
};
function ico(n){ return IP[n] ? '<svg class="i" viewBox="0 0 24 24"><path d="'+IP[n]+'"/></svg>' : ''; }
function hydrateIcons(){
  document.querySelectorAll('i[data-i]').forEach(function(e){
    const s = ico(e.dataset.i); if (s) e.outerHTML = s;
  });
}

let activeFilter = 'all';
let activeMode   = 'all';

function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ return []; } }
function save(list){ try{ localStorage.setItem(KEY,JSON.stringify(list)); }catch(e){} }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(iso){ return new Date(iso).toLocaleString([],{dateStyle:'medium',timeStyle:'short'}); }
function rider(id){ return RIDERS.find(r=>r.id===id); }
function host(id){ return HOSTS.find(h=>h.id===id); }
function labelsFor(r){ return r.mode==='stay' ? STAY_LABELS : LABELS; }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

function update(id, patch){
  const list = load().map(r=> r.id===id ? {...r,...patch,updatedAt:new Date().toISOString()} : r);
  save(list);
  RLive.after(list);
  render();
}

function setFilter(f, btn){
  activeFilter = f;
  document.querySelectorAll('.filter-tabs:not(.mode) .ftab').forEach(b=>b.classList.toggle('active',b===btn));
  render();
}
function setMode(m, btn){
  activeMode = m;
  document.querySelectorAll('.filter-tabs.mode .ftab').forEach(b=>b.classList.toggle('active',b===btn));
  render();
}

function tracker(status, labels){
  const idx = STEPS.indexOf(status);
  return '<div class="tracker">'+STEPS.map((s,i)=>{
    let c='t-step';
    if(status==='delivered'||i<idx) c+=' done';
    else if(i===idx) c+=' current';
    if(i===STEPS.length-1) c+=' final';
    return `<div class="${c}"><div class="tdot">${c.includes('done')?'✓':i+1}</div>${esc(labels[s])}</div>`;
  }).join('')+'</div>';
}

document.getElementById('adminList').addEventListener('click', e=>{
  const t = e.target.closest('[data-approve],[data-assign],[data-deliver]');
  if(!t) return;
  const d = t.dataset;
  if(d.approve){
    const rec = load().find(r=>r.id===d.approve);
    update(d.approve,{status:'approved'});
    toast(rec && rec.mode==='stay' ? 'Family verified ✓' : 'Request approved ✓');
  } else if(d.assign){
    const sel = document.querySelector(`[data-who-for="${d.assign}"]`);
    if(!sel||!sel.value){ toast('Please pick a rider or host home first'); return; }
    const rec = load().find(r=>r.id===d.assign);
    if(rec && rec.mode==='stay') update(d.assign,{hostId:sel.value,status:'on_the_way'});
    else                         update(d.assign,{riderId:sel.value,status:'on_the_way'});
    toast(rec && rec.mode==='stay' ? 'Host home assigned' : 'Rider assigned');
  } else if(d.deliver){
    const rec = load().find(r=>r.id===d.deliver);
    update(d.deliver,{status:'delivered'});
    toast(rec && rec.mode==='stay' ? 'Family marked as housed ✓' : 'Marked as delivered ✓');
  }
});

window.addEventListener('storage', e=>{ if(e.key===KEY) render(); });

function options(list, valFn, labFn){
  return list.map(v=>`<option value="${v.id}">${esc(labFn(v))}</option>`).join('');
}

function stayBox(r){
  const rows = [
    ['Family size', (r.people||1)+' person(s)'+(r.companions?' — '+r.companions:'')],
    ['Currently at', r.currentArea||'—'],
    ['Preferred area', r.prefArea||'No preference'],
    ['Stay needed', r.duration||'—'],
    ['Place type', r.stayType||'—'],
    ['For the host family', r.household||'—']
  ];
  return '<div class="stay-box">'+rows.map(x=>'<b>'+esc(x[0])+':</b> '+esc(x[1])).join('<br>')+'</div>';
}

function render(){
  const all = load();

  const cnt = s => all.filter(r=>r.status===s).length;
  document.getElementById('statsRow').innerHTML = STEPS.map(s=>
    `<div class="stat-box"><b>${cnt(s)}</b><span>${STAT_LABELS[s]}</span></div>`
  ).join('');

  let list = activeFilter==='all' ? all : all.filter(r=>r.status===activeFilter);
  if(activeMode!=='all') list = list.filter(r=>(r.mode||'supply')===activeMode);
  const el = document.getElementById('adminList');

  if(!list.length){
    el.innerHTML = '<div class="empty-state">No requests in this view yet.</div>';
    return;
  }

  el.innerHTML = list.map(r=>{
    const stay = r.mode==='stay';
    const labels = labelsFor(r);
    const rd = r.riderId && rider(r.riderId);
    const hm = r.hostId  && host(r.hostId);
    const chips = stay
      ? [ {t:'Find a home', icon:'stay'}, {t:r.duration}, {t:r.stayType}, {t:URGENCY[r.urgency]||'Normal', warn:r.urgency!=='normal'} ]
      : [ {t:r.catLabel}, {t:r.destLabel==='Shelter'?'Shelter delivery':'Home delivery', icon:r.destLabel==='Shelter'?'shield':'home'}, {t:r.items}, {t:URGENCY[r.urgency]||'Normal', warn:r.urgency!=='normal'} ];
    const chipHtml = chips.filter(c=>c.t)
      .map(c=>`<span class="item-chip${c.warn?(c.t==='Urgent'?' u-urgent':' u-critical'):''}">${c.icon?ico(c.icon):''}${esc(c.t)}</span>`).join('');

    let action = '';
    if(r.status==='sent'){
      action = `<div class="action-area">
        <button class="act-btn approve" data-approve="${r.id}">${stay?'✓ Verify family':'✓ Approve'}</button>
      </div>`;
    } else if(r.status==='approved'){
      action = `<div class="action-area">
        <select data-who-for="${r.id}">
          <option value="">${stay?'— Select a host home —':'— Select volunteer rider —'}</option>
          ${stay ? options(HOSTS, v=>v.id, v=>v.name+' (sleeps '+v.capacity+', '+v.phone+')')
                 : options(RIDERS, v=>v.id, v=>v.name+' ('+v.phone+')')}
        </select>
        <button class="act-btn assign" data-assign="${r.id}">${stay?'Assign Host Home':'Assign Rider'}</button>
      </div>`;
    } else if(r.status==='on_the_way'){
      const who = stay
        ? `<span class="who">${ico('key')} <strong>${esc(hm?hm.name:'—')}</strong> ${esc(hm?hm.phone:'')}</span>`
        : `<span class="who">${ico('scooter')} <strong>${esc(rd?rd.name:'—')}</strong> (${esc(rd?rd.phone:'')})</span>`;
      action = `<div class="action-area">${who}
        <button class="act-btn deliver" data-deliver="${r.id}">${stay?'✓ Mark as housed':'✓ Mark Delivered'}</button>
      </div>`;
    } else {
      const doneWho = stay ? (hm?hm.name:'response team') : (rd?rd.name:'response team');
      action = `<div class="action-area"><span class="who">${ico(stay?'key':'scooter')} ${stay?'Housed at ':'Delivered by '}${esc(doneWho)}</span></div>`;
    }

    return `<div class="req-card${r.urgency==='critical'?' critical':''}">
      <div class="req-head">
        <span class="req-id">${ico(r.icon||(stay?'stay':'bag'))} ${esc(r.catLabel||(stay?'Find a Home':'Home Supplies'))} · ${esc(r.id)}</span>
        <span class="badge-status ${r.status}">${esc(labels[r.status])}</span>
      </div>
      <div class="req-addr">${esc(r.name)} · ${esc(r.phone)}</div>
      ${stay
        ? `<div class="req-meta">Sent ${fmt(r.createdAt)}</div>${stayBox(r)}`
        : `<div class="req-meta">${esc(r.address)} · ${esc(r.quantity||1)} item(s) for ${esc(r.people||1)} people · ${fmt(r.createdAt)}</div>`}
      <div class="req-chips">${chipHtml}</div>
      ${r.note ? `<div class="req-note">Note: ${esc(r.note)}</div>` : ''}
      ${tracker(r.status, labels)}
      ${action}
    </div>`;
  }).join('');
  hydrateIcons();
}

hydrateIcons();
render();
/* live queue: citizen housing + supplies requests from every device */
RLive.bind({
  category:'shelter', listKey:KEY, admin:true,
  summary: r => r.mode==='stay'
    ? ('Host home for '+(r.people||1)+' people'+(r.companions?' ('+r.companions+')':'')+' · area '+(r.prefArea||r.currentArea||'any')+' · '+(r.duration||'')+' · '+(r.household||''))
    : ((r.catLabel||'Home supplies')+' · '+(r.items||'')+' · '+(r.quantity||1)+' unit(s) for '+(r.people||1)+' people · to '+(r.destLabel||'Home')+': '+(r.address||'')),
  onChanged: function(){ hydrateIcons(); render(); }
});
RLive.sync().then(function(){ render(); });
RLive.watch();
</script>
</body>
</html>
