<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home &amp; Damage Recovery | ReliefLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>/* ── TOKENS ── */
:root{--bg:#F5EEDB;--card:#FFFCF4;--g:#1B3A2A;--g2:#2F5A42;--g3:#0f2619;--gold:#C9A227;--gold2:#E8C86A;--ink:#1B3A2A;--mute:#8a866f;--line:#EADFC2;--sh:0 4px 24px rgba(27,58,42,.08);--p:#7C6CF0;--b:#4C8DF6;--gr:#3CC08E;--y:#F5B83D;--o:#F58A3D;--r:#EF5B5B;--rad:16px;--sidebar:250px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);scroll-behavior:smooth;}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;color:var(--ink);background:var(--bg);min-height:100vh;}
a{text-decoration:none;color:inherit;}button{font-family:inherit;cursor:pointer;}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;pointer-events:none;}
.field-input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:14px;resize:vertical;outline:none;transition:.2s;background:var(--bg);color:var(--ink);}
.field-input:focus{border-color:var(--gold);}
.hide{display:none!important;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.fade-up{animation:fadeUp .5s ease both;}
</style>
<style>
/* ── Page-specific ── */
.page-wrap { max-width:720px; margin:0 auto; padding:28px 16px 80px; }
.page-header { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
.page-header .back-btn {
  width:38px; height:38px; border-radius:50%; background:var(--card); border:1px solid var(--line);
  display:grid; place-items:center; flex:none; cursor:pointer; color:var(--g);
}
.page-header .back-btn:hover { background:var(--gold); color:var(--g); }
.page-title { font-size:22px; font-weight:800; color:var(--g); }
.page-sub { font-size:13px; color:var(--mute); margin-bottom:22px; }

/* type cards */
.type-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:22px; }
.type-card {
  background:var(--card); border:2px solid var(--line); border-radius:var(--rad);
  padding:24px 14px; text-align:center; cursor:pointer;
  transition:border-color .15s, background .15s; color:var(--ink);
}
.type-card:hover { border-color:var(--gold); }
.type-card.active { border-color:var(--gold); background:#FFF8E1; }
.type-card .tc-ico { display:grid; place-items:center; color:var(--g2); margin-bottom:8px; }
.type-card .tc-ico svg.i { width:32px; height:32px; }
.type-card.active .tc-ico { color:var(--gold); }
.type-card strong { display:block; font-size:15px; font-weight:700; color:var(--g); }
.type-card .tc-sub { color:var(--mute); font-size:12.5px; margin-top:3px; }

/* form card */
.form-card { background:var(--card); border:1px solid var(--line); border-radius:var(--rad); padding:22px; display:none; }
.form-card.visible { display:block; }
.form-card h3 { font-size:16px; font-weight:800; color:var(--g); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.form-card h3 svg.i { color:var(--gold); }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.form-label { font-size:12.5px; font-weight:600; color:var(--mute); display:grid; gap:5px; margin-bottom:12px; }
.form-label span { font-size:13px; font-weight:600; color:var(--g); }
.field-input {
  font-family:inherit; font-size:13.5px; color:var(--ink); background:var(--bg);
  padding:10px 13px; border:1px solid var(--line); border-radius:10px; width:100%;
  transition:border-color .15s;
}
.field-input:focus { outline:none; border-color:var(--gold); background:var(--card); }
textarea.field-input { resize:vertical; min-height:72px; }
select.field-input { appearance:auto; }

.submit-btn {
  width:100%; margin-top:6px; padding:13px; border:none; border-radius:12px;
  background:var(--g); color:#F5EEDB; font:700 14px 'Plus Jakarta Sans',sans-serif;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  transition:background .15s;
}
.submit-btn:hover { background:var(--g2); }

/* requests list */
.section-title { font-size:15px; font-weight:800; color:var(--g); margin:28px 0 14px; }
.req-card  { background:var(--card); border:1px solid var(--line); border-radius:var(--rad); padding:18px; margin-bottom:12px; }
.req-head  { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
.req-id    { font-size:13px; font-weight:700; color:var(--g); display:flex; align-items:center; gap:7px; }
.req-id svg.i { width:17px; height:17px; color:var(--g2); }
.req-meta  { font-size:12.5px; color:var(--mute); margin-bottom:10px; display:flex; align-items:flex-start; gap:6px; }
.req-meta svg.i { width:14px; height:14px; flex:none; margin-top:1px; color:var(--g2); }
.req-items { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.item-chip {
  font-size:12px; font-weight:600; padding:3px 10px; border-radius:99px;
  background:var(--bg); border:1px solid var(--line); color:var(--g);
}
.item-chip.sev-major { background:#FEE2E2; border-color:#FCA5A5; color:#991B1B; }

.badge-status { font-size:11.5px; font-weight:700; padding:3px 11px; border-radius:99px; background:var(--line); color:var(--g); }
.badge-status.sent       { background:#EEF2FF; color:#4338CA; }
.badge-status.approved   { background:#ECFDF5; color:#065F46; }
.badge-status.on_the_way { background:#FEF3C7; color:#92400E; }
.badge-status.delivered  { background:#D1FAE5; color:#065F46; }

/* tracker */
.tracker { display:grid; grid-template-columns:repeat(4,1fr); margin:14px 0 8px; }
.t-step  { text-align:center; position:relative; font-size:11.5px; color:var(--mute); }
.t-step .tdot {
  width:24px; height:24px; border-radius:50%; background:var(--line); color:#fff;
  display:grid; place-items:center; margin:0 auto 6px; font-size:10px;
  position:relative; z-index:1; font-weight:700;
}
.t-step::before { content:""; position:absolute; top:11px; left:-50%; width:100%; height:3px; background:var(--line); }
.t-step:first-child::before { display:none; }
.t-step.done .tdot            { background:var(--g); }
.t-step.done::before,
.t-step.current::before       { background:var(--g); }
.t-step.current .tdot         { background:var(--gold); box-shadow:0 0 0 4px #FFF0B3; }
.t-step.done,.t-step.current  { color:var(--g); font-weight:700; }
.t-step.final.done .tdot      { background:var(--gr); }

.team-info    { display:flex; align-items:center; gap:8px; background:var(--bg); border-radius:10px; padding:10px 13px; margin-top:10px; font-size:13px; }
.team-info svg.i { width:16px; height:16px; color:var(--g2); flex:none; }
.team-info strong { color:var(--g); }
.done-note    { margin-top:10px; font-size:12.5px; color:var(--mute); display:flex; align-items:center; gap:7px; }
.done-note svg.i { width:15px; height:15px; color:var(--gr); }
.empty-state  { text-align:center; color:var(--mute); padding:30px 16px; border:1px dashed var(--line); border-radius:var(--rad); font-size:13.5px; }

.rl-toast {
  position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%);
  background:var(--g); color:#F5EEDB; padding:10px 20px; border-radius:10px;
  font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .22s;
  white-space:nowrap; z-index:999;
}
.rl-toast.show { opacity:1; }

@media(max-width:520px){
  .form-row  { grid-template-columns:1fr; }
  .tracker   { font-size:9.5px; }
}
</style>
</head>
<body>

<div class="page-wrap">

  <!-- Header -->
  <div class="page-header">
    <button class="back-btn" onclick="history.back()" title="Go back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h1 class="page-title">Home &amp; Damage Recovery</h1>
  </div>
  <p class="page-sub">Report the damage to your house and the recovery team will be assigned. No map needed — just describe the site.</p>

  <!-- Damage type selector -->
  <div class="type-grid" role="group" aria-label="Damage type">
    <button type="button" class="type-card" data-type="water" onclick="selectType(this)">
      <span class="tc-ico"><i data-i="drop"></i></span>
      <strong>Water &amp; Flood Damage</strong>
      <span class="tc-sub">Entered house, mud, wet contents</span>
    </button>
    <button type="button" class="type-card" data-type="roof"  onclick="selectType(this)">
      <span class="tc-ico"><i data-i="roof"></i></span>
      <strong>Roof &amp; Structure</strong>
      <span class="tc-sub">Torn roof, weak walls, partial collapse</span>
    </button>
    <button type="button" class="type-card" data-type="floor" onclick="selectType(this)">
      <span class="tc-ico"><i data-i="brick"></i></span>
      <strong>Walls, Floors &amp; Doors</strong>
      <span class="tc-sub">Cracked plaster, damaged flooring</span>
    </button>
    <button type="button" class="type-card" data-type="power" onclick="selectType(this)">
      <span class="tc-ico"><i data-i="bolt"></i></span>
      <strong>Electricity &amp; Contents</strong>
      <span class="tc-sub">Wiring, appliances, furniture ruined</span>
    </button>
  </div>

  <!-- Request form (shown after selecting a damage type) -->
  <div class="form-card" id="reqForm">
    <h3 id="formTitle">Damage Recovery Request</h3>
    <form id="theForm" onsubmit="submitReq(event)">

      <div class="form-row">
        <label class="form-label"><span>Full name</span><input class="field-input" name="name" required placeholder="Your full name"></label>
        <label class="form-label"><span>Phone</span><input class="field-input" name="phone" type="tel" required placeholder="03xx-xxxxxxx"></label>
      </div>

      <label class="form-label">
        <span>Address of the damaged house</span>
        <input class="field-input" name="address" required placeholder="House / plot no., street, mohalla, city">
      </label>

      <div class="form-row">
        <label class="form-label">
          <span>Damage level</span>
          <select class="field-input" name="severity" id="severitySelect">
            <option value="">— Select —</option>
          </select>
        </label>
        <label class="form-label"><span>Rooms affected</span><input class="field-input" name="rooms" type="number" min="1" value="1" required></label>
      </div>

      <div class="form-row">
        <label class="form-label">
          <span>Is anyone living there?</span>
          <select class="field-input" name="occupied">
            <option>Yes — family living in the damaged house</option>
            <option>Yes — elderly / children only</option>
            <option>No — house is empty</option>
          </select>
        </label>
        <label class="form-label"><span>People in the house</span><input class="field-input" name="people" type="number" min="0" value="0" required></label>
      </div>

      <label class="form-label">
        <span>What do you need?</span>
        <select class="field-input" name="support" id="supportSelect">
          <option value="">— Select support —</option>
        </select>
      </label>

      <label class="form-label">
        <span>Landmark / easy way to reach</span>
        <input class="field-input" name="landmark" placeholder="e.g. next to Jamia Mosque, behind Bait-ul-Mahro shop">
      </label>

      <label class="form-label">
        <span>Description <small style="font-weight:400">(optional)</small></span>
        <textarea class="field-input" name="note" rows="3" placeholder="What happened, when, and anything the team should know…"></textarea>
      </label>

      <button class="submit-btn" type="submit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        Send Request
      </button>
    </form>
  </div>

  <!-- My requests -->
  <div class="section-title">My Requests</div>
  <div id="myList"></div>

</div>
<div class="rl-toast" id="toast"></div>

<script src="../config.js"></script>
<script src="livesync.js"></script>
<script>
const KEY    = 'relieflink_recovery_requests';
const STEPS  = ['sent','approved','on_the_way','delivered'];
const LABELS = { sent:'Report Filed', approved:'Site Assessed', on_the_way:'Team On the Way', delivered:'Work Completed' };
const TEAMS = [
  {id:'t1',name:'Recovery Team 1 — Jadoon',   phone:'0300-7777701'},
  {id:'t2',name:'Recovery Team 2 — Al-Khidmat',phone:'0301-7777702'},
  {id:'t3',name:'PDMA Repair Crew 3',          phone:'0302-7777703'}
];

/* Damage options per type */
const CAT_META = {
  water: { icon:'drop',  label:'Water & Flood Damage',
    support:['Debris & mud removal','Water pumping / draining','Drying & disinfection','Ration of cleaning supplies','Full house cleaning crew'] },
  roof:  { icon:'roof',  label:'Roof & Structure',
    support:['Tarpaulin / temporary roof','Damaged sheet & wood supply','Mason for wall repair','Structural inspection by engineer','Rebuilding estimate visit'] },
  floor: { icon:'brick', label:'Walls, Floors & Doors',
    support:['Plaster & paint material','Flooring / tiles supply','Door & frame replacement','Mason visit for patching','Full room restoration'] },
  power: { icon:'bolt',  label:'Electricity & Contents',
    support:['Electrician — rewiring','Bulb, socket & switch supply','Appliance check / repair','Furniture salvage & drying','New wiring material kit'] }
};
const SEVERITY = ['Minor — surface damage','Significant — usable after repair','Major — parts of house unsafe','House destroyed — needs rebuilding'];

/* Simple line icons — same style as the dashboard icon set */
const IP = {
  drop:   'M12 2.7s6 6.3 6 11.3a6 6 0 0 1-12 0c0-5 6-11.3 6-11.3z',
  roof:   'M3 11l9-8 9 8 M5 10v10h14V10 M12 3v4',
  brick:  'M3 6h18v12H3z M3 10h18 M3 14h18 M9 6v4 M15 10v4 M9 14v4',
  bolt:   'M13 2 4 14h7l-1 8 9-12h-7z',
  tools:  'M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3-3a6 6 0 0 1-7 7l-1.4 1.4a1 1 0 0 1-1.4 0L7 10.4a1 1 0 0 1 0-1.4L8.4 7.6a6 6 0 0 1 7-7z',
  users:  'M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2 M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M21 21v-2a4 4 0 0 0-3-3.9 M16 3.1a4 4 0 0 1 0 7.8',
  phone:  'M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .8 2.9a2 2 0 0 1-.5 2.1L8.1 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.4 1.9.7 2.9.8a2 2 0 0 1 1.6 1.9z',
  note:   'M12 20h9 M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',
  check:  'M20 6 9 17l-5-5'
};
function ico(n){ return IP[n] ? '<svg class="i" viewBox="0 0 24 24"><path d="'+IP[n]+'"/></svg>' : ''; }
function hydrateIcons(){
  document.querySelectorAll('i[data-i]').forEach(function(e){
    const s = ico(e.dataset.i); if (s) e.outerHTML = s;
  });
}

function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ return []; } }
function save(list){ try{ localStorage.setItem(KEY,JSON.stringify(list)); }catch(e){} }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(iso){ return new Date(iso).toLocaleString([],{dateStyle:'medium',timeStyle:'short'}); }
function team(id){ return TEAMS.find(t=>t.id===id); }

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

function myId(){
  try{
    let i=localStorage.getItem('relieflink_user_id');
    if(!i){ i='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); localStorage.setItem('relieflink_user_id',i); }
    return i;
  }catch(e){ return 'me'; }
}

let currentType = null;

function selectType(btn){
  currentType = btn.dataset.type;
  document.querySelectorAll('.type-card').forEach(b=>b.classList.toggle('active',b===btn));
  const meta = CAT_META[currentType];

  document.getElementById('formTitle').innerHTML = ico(meta.icon) + ' ' + esc(meta.label) + ' Request';

  const sv = document.getElementById('severitySelect');
  sv.innerHTML = '<option value="">— Select —</option>'
    + SEVERITY.map(s=>`<option>${s}</option>`).join('');

  const sp = document.getElementById('supportSelect');
  sp.innerHTML = '<option value="">— Select support —</option>'
    + meta.support.map(s=>`<option>${s}</option>`).join('');

  const fc = document.getElementById('reqForm');
  fc.classList.add('visible');
  fc.querySelector('input').focus();
}

function submitReq(e){
  e.preventDefault();
  if(!currentType) return;
  const d = Object.fromEntries(new FormData(e.target));
  const meta = CAT_META[currentType];
  const list = load();
  list.unshift({
    id:        'REC-'+Date.now().toString(36).toUpperCase().slice(-5),
    userId:    myId(),
    category:  currentType,
    catLabel:  meta.label,
    icon:      meta.icon,
    name:      d.name,
    phone:     d.phone,
    address:   d.address,
    landmark:  d.landmark||'',
    severity:  d.severity,
    rooms:     +d.rooms,
    occupied:  d.occupied,
    people:    +d.people,
    support:   d.support,
    note:      d.note||'',
    status:    'sent',
    teamId:    null,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  });
  save(list);
  RLive.after(list);
  e.target.reset();
  document.getElementById('reqForm').classList.remove('visible');
  currentType = null;
  document.querySelectorAll('.type-card').forEach(b=>b.classList.remove('active'));
  toast('Damage report sent! The recovery team has been notified.');
  render();
}

function update(id,patch){
  const list = load().map(r=>r.id===id?{...r,...patch,updatedAt:new Date().toISOString()}:r);
  save(list);
  RLive.after(list);
  render();
}

function tracker(status){
  const idx=STEPS.indexOf(status);
  return '<div class="tracker">'+STEPS.map((s,i)=>{
    let c='t-step';
    if(status==='delivered'||i<idx) c+=' done';
    else if(i===idx) c+=' current';
    if(i===STEPS.length-1) c+=' final';
    return `<div class="${c}"><div class="tdot">${c.includes('done')?'✓':i+1}</div>${LABELS[s]}</div>`;
  }).join('')+'</div>';
}

window.addEventListener('storage',e=>{ if(e.key===KEY) render(); });

function render(){
  const mine=load().filter(r=>r.userId===myId());
  const el=document.getElementById('myList');
  if(!mine.length){
    el.innerHTML='<div class="empty-state">No recovery requests yet. Select a damage type above to report one.</div>';
    return;
  }
  el.innerHTML=mine.map(r=>{
    const tm=r.teamId&&team(r.teamId);
    const chips=[r.catLabel,r.severity,r.rooms+' room(s)',r.support]
      .filter(Boolean).map(t=>`<span class="item-chip${String(t).indexOf('Major')===0||String(t).indexOf('destroyed')>-1?' sev-major':''}">${esc(t)}</span>`).join('');
    const teamHtml=tm&&(r.status==='on_the_way'||r.status==='delivered')
      ?`<div class="team-info">${ico('users')}Team: <strong>${esc(tm.name)}</strong>&nbsp;&nbsp;${ico('phone')}${esc(tm.phone)}</div>`:'';
    const doneHtml=r.status==='delivered'?`<div class="done-note">${ico('check')} Recovery work completed. Shukriya!</div>`:'';
    return `<div class="req-card">
      <div class="req-head">
        <span class="req-id">${ico(r.icon||'tools')} ${esc(r.catLabel)} · ${esc(r.id)}</span>
        <span class="badge-status ${r.status}">${LABELS[r.status]}</span>
      </div>
      <div class="req-meta">${esc(r.address)} · ${fmt(r.createdAt)}</div>
      <div class="req-items">${chips}</div>
      ${r.note?`<div class="req-meta" style="font-style:italic">${ico('note')}<span>${esc(r.note)}</span></div>`:''}
      ${tracker(r.status)}
      ${teamHtml}
      ${doneHtml}
    </div>`;
  }).join('');
}

hydrateIcons();
render();
/* live: the recovery desk sees the report on their own screen */
RLive.bind({
  category:'recovery', listKey:KEY, mine:true, uid: myId,
  summary: r => (r.catLabel||'Damage report')+' · '+(r.severity||'')+' · '+(r.rooms||0)+' rooms · '+(r.people||1)+' people · '+(r.address||'')+(r.landmark?' near '+r.landmark:''),
  onChanged: function(){ hydrateIcons(); render(); }
});
RLive.sync().then(function(){ render(); });
RLive.watch();
</script>
</body>
</html>
